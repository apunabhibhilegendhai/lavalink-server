name: Lavalink Public 24/7 Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: lavalink-session
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  lavalink:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Lavalink Core Jar
        id: cache-lavalink
        uses: actions/cache@v4
        with:
          path: Lavalink.jar
          key: lavalink-v4.2.2-jar

      - name: Download Lavalink v4.2.2 Jar (if not cached)
        if: steps.cache-lavalink.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "Lavalink.jar" ] || [ $(wc -c < "Lavalink.jar" 2>/dev/null || echo 0) -lt 10000000 ]; then
            echo "Fetching Lavalink v4.2.2 from GitHub Releases..."
            curl -sLo Lavalink.jar https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar
          fi
          ls -lh Lavalink.jar

      - name: Configure application.yml
        env:
          NODE_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          SP_DC_COOKIE: ${{ secrets.SPOTIFY_SP_DC || '' }}
        run: |
          if [ ! -f "application.yml" ]; then
            if [ -f "application.example.yml" ]; then
              cp application.example.yml application.yml
            else
              echo "Error: application.yml not found!" && exit 1
            fi
          fi

          # Replace password
          sed -i "s|password: .*|password: \"${NODE_PASSWORD}\"|g" application.yml

          # Set YouTube OAuth token if provided
          if [ -n "$YT_REFRESH_TOKEN" ]; then
            sed -i "s|refreshToken: .*|refreshToken: \"${YT_REFRESH_TOKEN}\"|g" application.yml
          fi

          # Set Spotify SP_DC cookie if provided
          if [ -n "$SP_DC_COOKIE" ]; then
            sed -i "s|spDc: .*|spDc: \"${SP_DC_COOKIE}\"|g" application.yml
          fi

          echo "Configuration updated successfully."

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Lavalink Node
        run: |
          echo "Starting Lavalink process..."
          nohup java -Xmx2G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -jar Lavalink.jar > lavalink.log 2>&1 &
          echo "LAVALINK_PID=$!" >> $GITHUB_ENV
          echo "Lavalink PID: $!"

      - name: Wait for Lavalink Ready
        run: |
          echo "Checking Lavalink initialization..."
          READY=false
          for i in {1..40}; do
            if grep -q "Lavalink is ready to accept connections" lavalink.log 2>/dev/null; then
              READY=true
              break
            fi
            sleep 2
          done

          if [ "$READY" = "true" ]; then
            echo "Lavalink is up and running!"
          else
            echo "::warning::Lavalink startup message not detected yet. Tail of log:"
            tail -n 30 lavalink.log || true
          fi

      - name: Start Cloudflare Tunnel & Expose Lavalink
        id: tunnel
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "Starting persistent Cloudflare Named Tunnel..."
            nohup cloudflared tunnel run --token "$CF_TOKEN" > tunnel.log 2>&1 &
            echo "TUNNEL_PID=$!" >> $GITHUB_ENV
            
            HOST="${CF_CUSTOM_DOMAIN:-Configured-Cloudflare-Domain}"
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=https://$HOST" >> $GITHUB_ENV
          else
            echo "Starting temporary Cloudflare Quick Tunnel..."
            nohup cloudflared tunnel --url http://127.0.0.1:4998 > tunnel.log 2>&1 &
            echo "TUNNEL_PID=$!" >> $GITHUB_ENV

            echo "Waiting for Quick Tunnel URL..."
            TUNNEL_URL=""
            for i in {1..30}; do
              TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$TUNNEL_URL" ]; then
              echo "::error::Could not extract Cloudflare Tunnel URL!"
              cat tunnel.log
              exit 1
            fi

            HOST=$(echo "$TUNNEL_URL" | sed 's~https://~~')
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=$TUNNEL_URL" >> $GITHUB_ENV
          fi

      - name: Announce Connection Details
        env:
          NODE_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "======================================================"
          echo "🎉 LAVALINK PUBLIC NODE IS ACTIVE!"
          echo "======================================================"
          echo "Host     : $PUBLIC_HOST"
          echo "Port     : $PUBLIC_PORT"
          echo "Password : $NODE_PASSWORD"
          echo "Secure   : $PUBLIC_SECURE"
          echo "REST URI : $PUBLIC_URL"
          echo "WS URI   : wss://$PUBLIC_HOST:$PUBLIC_PORT/v4/websocket"
          echo "Session  : #${{ github.run_number }}"
          echo "======================================================"

          # Output to GitHub Step Summary
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 👑 Lavalink Node Active

          | Parameter | Value |
          |---|---|
          | **Host** | `${{ env.PUBLIC_HOST }}` |
          | **Port** | `443` |
          | **Password** | `${{ env.NODE_PASSWORD }}` |
          | **Secure (SSL/WSS)** | `true` |
          | **REST Endpoint** | `${{ env.PUBLIC_URL }}` |
          | **WebSocket Endpoint** | `wss://${{ env.PUBLIC_HOST }}:443/v4/websocket` |
          | **Session #** | `${{ github.run_number }}` |

          ### 🔌 Discord Bot Connection Example (Python / Wavelink)
          ```python
          node = wavelink.Node(
              uri="${{ env.PUBLIC_URL }}",
              password="${{ env.NODE_PASSWORD }}"
          )
          ```

          ### 🔌 Discord.js Connection Example (Kazagurumo / Poru)
          ```javascript
          {
            name: "GitHub-Lavalink",
            url: "${{ env.PUBLIC_HOST }}:443",
            auth: "${{ env.NODE_PASSWORD }}",
            secure: true
          }
          ```
          EOF

          # Send Discord Webhook notification if configured
          if [ -n "$DISCORD_WEBHOOK" ]; then
            echo "Sending Discord notification..."
            curl -s -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d "{
              \"username\": \"Lavalink Node Monitor\",
              \"avatar_url\": \"https://raw.githubusercontent.com/lavalink-devs/Lavalink/master/.github/assets/lavalink-logo.png\",
              \"embeds\": [{
                \"title\": \"🟢 Lavalink Public Server Online!\",
                \"description\": \"Your Lavalink audio node has been launched via GitHub Actions.\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"🌐 Host\", \"value\": \"\`$PUBLIC_HOST\`\", \"inline\": false},
                  {\"name\": \"🔌 Port\", \"value\": \"\`443\`\", \"inline\": true},
                  {\"name\": \"🔒 Secure\", \"value\": \"\`true (SSL/WSS)\`\", \"inline\": true},
                  {\"name\": \"🔑 Password\", \"value\": \"\`$NODE_PASSWORD\`\", \"inline\": true},
                  {\"name\": \"📡 WebSocket URI\", \"value\": \"\`wss://$PUBLIC_HOST:443/v4/websocket\`\", \"inline\": false},
                  {\"name\": \"🔁 Session Run\", \"value\": \"#${{ github.run_number }}\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"Next session will auto-dispatch in ~5.5 hours\"}
              }]
            }" || true
          fi

      - name: Keep Runner Alive & Monitor Health
        run: |
          # Keep runner alive up to 330 minutes (5.5 hrs)
          # GitHub Actions timeout is 360 mins; 330 mins gives 30 mins buffer for clean recovery.
          END_TIME=$((SECONDS + 330 * 60))
          echo "Starting 5.5-hour keep-alive loop..."

          while [ $SECONDS -lt $END_TIME ]; do
            # Check Lavalink process
            if ! kill -0 $LAVALINK_PID 2>/dev/null; then
              echo "::error::Lavalink process exited unexpectedly!"
              tail -n 50 lavalink.log || true
              exit 1
            fi

            # Check Tunnel process
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "::error::Cloudflare tunnel process exited unexpectedly!"
              tail -n 50 tunnel.log || true
              exit 1
            fi

            sleep 30
          done
          echo "Session duration reached. Gracefully exiting to trigger next session..."

  # Recovery job: Automatically dispatches the next session so Lavalink runs 24/7
  recover:
    needs: lavalink
    if: always() && needs.lavalink.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Prevent Duplicate Sessions
        id: check_active
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GH_REPOSITORY}/actions/workflows/lavalink.yml/runs?per_page=30" || echo '{"workflow_runs":[]}')"
          active="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[] | select((.id | tostring) != $current) | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Another session is already running or queued. Skipping duplicate dispatch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Next Session
        if: steps.check_active.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Dispatching next Lavalink session on branch: $BRANCH..."
          gh api --method POST \
            "repos/${GH_REPOSITORY}/actions/workflows/lavalink.yml/dispatches" \
            -f ref="$BRANCH"
          echo "Next session dispatched successfully!"

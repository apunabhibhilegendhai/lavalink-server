name: 24/7 Lavalink & Soundy Matrix Services

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: 247-services
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        service: [lavalink, soundy]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========================================================================
      # SERVICE 1: LAVALINK AUDIO NODE
      # ========================================================================
      - name: Setup Java 21 LTS (Lavalink)
        if: matrix.service == 'lavalink'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Lavalink Core Jar
        if: matrix.service == 'lavalink'
        id: cache-lavalink
        uses: actions/cache@v4
        with:
          path: Lavalink.jar
          key: lavalink-v4.2.2-jar

      - name: Download Lavalink v4.2.2 Jar (if not cached)
        if: matrix.service == 'lavalink' && steps.cache-lavalink.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "Lavalink.jar" ] || [ $(wc -c < "Lavalink.jar" 2>/dev/null || echo 0) -lt 10000000 ]; then
            echo "Fetching Lavalink v4.2.2..."
            curl -sLo Lavalink.jar https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar
          fi
          ls -lh Lavalink.jar

      - name: Configure application.yml (Lavalink)
        if: matrix.service == 'lavalink'
        env:
          NODE_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          SP_DC_COOKIE: ${{ secrets.SPOTIFY_SP_DC || '' }}
        run: |
          if [ ! -f "application.yml" ]; then
            cp application.example.yml application.yml
          fi

          sed -i "s|password: .*|password: \"${NODE_PASSWORD}\"|g" application.yml

          if [ -n "$YT_REFRESH_TOKEN" ]; then
            sed -i "/oauth:/,/refreshToken:/ s/enabled: false/enabled: true/" application.yml
            sed -i "s|refreshToken: .*|refreshToken: \"${YT_REFRESH_TOKEN}\"|g" application.yml
          fi

          if [ -n "$SP_DC_COOKIE" ]; then
            sed -i "s|spDc: .*|spDc: \"${SP_DC_COOKIE}\"|g" application.yml
          fi

      - name: Install Cloudflare Tunnel (cloudflared)
        if: matrix.service == 'lavalink'
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Lavalink Node
        if: matrix.service == 'lavalink'
        run: |
          nohup java -Xmx2G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -jar Lavalink.jar > lavalink.log 2>&1 &
          echo "LAVALINK_PID=$!" >> $GITHUB_ENV
          echo "Lavalink PID: $!"

      - name: Wait for Lavalink Ready
        if: matrix.service == 'lavalink'
        run: |
          echo "Waiting for Lavalink initialization..."
          READY=false
          for i in {1..40}; do
            if grep -q "Lavalink is ready to accept connections" lavalink.log 2>/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 $LAVALINK_PID 2>/dev/null; then
              echo "::error::Lavalink crashed during startup!"
              cat lavalink.log
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" = "true" ]; then
            echo "Lavalink is online and listening!"
          else
            echo "::error::Lavalink startup timed out!"
            tail -n 40 lavalink.log || true
            exit 1
          fi

      - name: Start Cloudflare Tunnel & Expose Lavalink
        if: matrix.service == 'lavalink'
        id: tunnel
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "Starting persistent Cloudflare Named Tunnel..."
            nohup cloudflared tunnel run --token "$CF_TOKEN" > tunnel.log 2>&1 &
            echo "TUNNEL_PID=$!" >> $GITHUB_ENV

            HOST="${CF_CUSTOM_DOMAIN:-lavalink.opendrive.indevs.in}"
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=https://$HOST" >> $GITHUB_ENV
          else
            echo "Starting temporary Cloudflare Quick Tunnel..."
            nohup cloudflared tunnel --url http://127.0.0.1:4998 > tunnel.log 2>&1 &
            echo "TUNNEL_PID=$!" >> $GITHUB_ENV

            TUNNEL_URL=""
            for i in {1..30}; do
              TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then break; fi
              sleep 2
            done

            if [ -z "$TUNNEL_URL" ]; then
              echo "::error::Could not extract Cloudflare Tunnel URL!"
              cat tunnel.log
              exit 1
            fi

            HOST=$(echo "$TUNNEL_URL" | sed 's~https://~~')
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=$TUNNEL_URL" >> $GITHUB_ENV
          fi

      - name: Announce Lavalink Connection Details
        if: matrix.service == 'lavalink'
        env:
          NODE_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "======================================================"
          echo "🎉 LAVALINK PUBLIC NODE ONLINE: $PUBLIC_URL"
          echo "======================================================"

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 👑 Lavalink Node Active

          | Parameter | Value |
          |---|---|
          | **Host** | `${{ env.PUBLIC_HOST }}` |
          | **Port** | `443` |
          | **Password** | `${{ env.NODE_PASSWORD }}` |
          | **REST Endpoint** | `${{ env.PUBLIC_URL }}` |
          | **WebSocket Endpoint** | `wss://${{ env.PUBLIC_HOST }}:443/v4/websocket` |
          | **Session #** | `${{ github.run_number }}` |
          EOF

          cat << EOF > NODE_STATUS.md
          # 🟢 Live Public Lavalink Node

          > **Status**: ONLINE 🟢  
          > **Session Run**: #${{ github.run_number }}  
          > **Last Started**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### 🌐 Public Connection Details

          | Setting | Value |
          |---|---|
          | **Host** | \`$PUBLIC_HOST\` |
          | **Port** | \`443\` |
          | **Password** | \`$NODE_PASSWORD\` |
          | **SSL / Secure** | \`true\` |
          | **REST URI** | \`$PUBLIC_URL\` |
          | **WebSocket URI** | \`wss://$PUBLIC_HOST:443/v4/websocket\` |
          EOF
          sed -i 's/^[ ]\{10\}//' NODE_STATUS.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NODE_STATUS.md
          git commit -m "docs: update live public node status [skip ci]" || true
          git push origin main || true

      - name: Keep Lavalink Alive & Monitor Health
        if: matrix.service == 'lavalink'
        run: |
          END_TIME=$((SECONDS + 330 * 60))
          echo "Keeping Lavalink runner alive for 5.5 hours..."
          while [ $SECONDS -lt $END_TIME ]; do
            if ! kill -0 $LAVALINK_PID 2>/dev/null; then
              echo "::error::Lavalink process exited unexpectedly!"
              tail -n 50 lavalink.log || true
              exit 1
            fi
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "::error::Tunnel process exited unexpectedly!"
              tail -n 50 tunnel.log || true
              exit 1
            fi
            sleep 30
          done

      # ========================================================================
      # SERVICE 2: SOUNDY DISCORD BOT
      # ========================================================================
      - name: Setup Bun (Soundy)
        if: matrix.service == 'soundy'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Soundy Dependencies
        if: matrix.service == 'soundy'
        working-directory: soundy
        run: |
          echo "Installing Soundy bot dependencies via Bun..."
          bun install

      - name: Start Soundy Bot Connected to Lavalink
        if: matrix.service == 'soundy'
        working-directory: soundy
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD || '' }}
          LAVALINK_HOST: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN || 'lavalink.opendrive.indevs.in' }}
          LAVALINK_PORT: '443'
          LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}
          LAVALINK_SECURE: 'true'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || '' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::DISCORD_BOT_TOKEN (or TOKEN) is not yet set in GitHub Secrets!"
            echo "To connect your bot to Discord, please add secret: DISCORD_BOT_TOKEN."
            echo "The runner will stay in standby so matrix won't fail."
            sleep 3600
            exit 0
          fi

          echo "Generating soundy/.env file for dotenvx..."
          cat << EOF > .env
          TOKEN=${TOKEN}
          DISCORD_BOT_TOKEN=${TOKEN}
          DATABASE_URL=${DATABASE_URL}
          DATABASE_PASSWORD=${DATABASE_PASSWORD}
          LAVALINK_HOST=${LAVALINK_HOST}
          LAVALINK_PORT=${LAVALINK_PORT}
          LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
          LAVALINK_SECURE=${LAVALINK_SECURE}
          DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
          EOF
          sed -i 's/^[ ]\{10\}//' .env

          echo "======================================================"
          echo "🤖 Starting Soundy Bot..."
          echo "📡 Connecting to Lavalink Node at: $LAVALINK_HOST:$LAVALINK_PORT (SSL: $LAVALINK_SECURE)"
          echo "======================================================"

          bun run start > bot.log 2>&1 &
          BOT_PID=$!
          echo "BOT_PID=$BOT_PID" >> $GITHUB_ENV
          echo "Bot PID: $BOT_PID"

          # Allow bot 10 seconds to connect and print early output
          sleep 10
          cat bot.log || true

          END_TIME=$((SECONDS + 330 * 60))
          echo "Keeping Soundy bot runner alive for 5.5 hours..."
          while [ $SECONDS -lt $END_TIME ]; do
            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "::error::Soundy bot process stopped unexpectedly! Output log:"
              cat bot.log || true
              exit 1
            fi
            sleep 30
          done

  # ============================================================================
  # RECOVERY JOB (Self-Healing 24/7 Loop)
  # ============================================================================
  recover:
    needs: service
    if: always() && needs.service.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Prevent Duplicate Sessions
        id: check_active
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GH_REPOSITORY}/actions/workflows/lavalink.yml/runs?per_page=30" || echo '{"workflow_runs":[]}')"
          active="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[] | select((.id | tostring) != $current) | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Another session is already running. Skipping duplicate dispatch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Next Matrix Session
        if: steps.check_active.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Dispatching next 24/7 matrix session on branch: $BRANCH..."
          gh api --method POST \
            "repos/${GH_REPOSITORY}/actions/workflows/lavalink.yml/dispatches" \
            -f ref="$BRANCH"
          echo "Next session dispatched successfully!"

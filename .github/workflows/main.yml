name: 24/7 Production Matrix Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: 247-matrix-engine
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  matrix-runner:
    name: ${{ matrix.component == 'lavalink' && 'Lavalink Audio Node' || 'Discord Music Bot Fleet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        component: [lavalink, music-bot]
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_TOKENS: ${{ secrets.DISCORD_TOKENS }}
      ALL_BOT_IDS: ${{ secrets.ALL_BOT_IDS }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      GUILD_ID: ${{ secrets.GUILD_ID }}
      NODE_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}

    steps:
      # ========================================================================
      # SHARED INITIALIZATION
      # ========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========================================================================
      # MATRIX COMPONENT A: LAVALINK AUDIO NODE
      # ========================================================================
      - name: Setup Java 21 LTS (Lavalink)
        if: matrix.component == 'lavalink'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Lavalink Core Jar
        if: matrix.component == 'lavalink'
        id: cache-lavalink
        uses: actions/cache@v4
        with:
          path: Lavalink.jar
          key: lavalink-v4.2.2-jar

      - name: Download Lavalink v4.2.2 Jar (if not cached)
        if: matrix.component == 'lavalink' && steps.cache-lavalink.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "Lavalink.jar" ] || [ $(wc -c < "Lavalink.jar" 2>/dev/null || echo 0) -lt 10000000 ]; then
            echo "Fetching Lavalink v4.2.2..."
            curl -sLo Lavalink.jar https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar
          fi
          ls -lh Lavalink.jar

      - name: Configure application.yml
        if: matrix.component == 'lavalink'
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          SP_DC_COOKIE: ${{ secrets.SPOTIFY_SP_DC || '' }}
        run: |
          if [ ! -f "application.yml" ]; then
            cp application.example.yml application.yml
          fi
          sed -i "s|password: .*|password: \"${NODE_PASSWORD}\"|g" application.yml
          if [ -n "$YT_REFRESH_TOKEN" ]; then
            sed -i "/oauth:/,/refreshToken:/ s/enabled: false/enabled: true/" application.yml
            sed -i "/oauth:/,/refreshToken:/ s/skipInitialization: false/skipInitialization: true/" application.yml
            sed -i "s|refreshToken: .*|refreshToken: \"${YT_REFRESH_TOKEN}\"|g" application.yml
          fi
          if [ -n "$SP_DC_COOKIE" ]; then
            sed -i "s|spDc: .*|spDc: \"${SP_DC_COOKIE}\"|g" application.yml
          fi

      - name: Optimize Linux Kernel Network & DNS (Ultra-Low Latency)
        if: matrix.component == 'lavalink'
        run: |
          echo "Applying Linux kernel socket and network latency optimizations..."
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.somaxconn=65535 || true
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
          sudo sysctl -w net.core.netdev_max_backlog=10000 || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true
          sudo sysctl -w net.ipv4.tcp_fin_timeout=15 || true
          sudo sysctl -w net.ipv4.tcp_low_latency=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          sudo sysctl -w net.core.rmem_max=16777216 || true
          sudo sysctl -w net.core.wmem_max=16777216 || true
          sudo sysctl -w net.core.rmem_default=2097152 || true
          sudo sysctl -w net.core.wmem_default=2097152 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216" || true
          sudo sysctl -w net.ipv4.udp_rmem_min=16384 || true
          sudo sysctl -w net.ipv4.udp_wmem_min=16384 || true
          ulimit -n 65535 || true
          echo "Injecting ultra-fast Anycast DNS (Cloudflare 1.1.1.1 & Google 8.8.8.8)..."
          sudo sed -i '1i nameserver 1.1.1.1\nnameserver 1.0.0.1\nnameserver 8.8.8.8' /etc/resolv.conf || true

      - name: Install Cloudflare Tunnel (cloudflared)
        if: matrix.component == 'lavalink'
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Lavalink Node (Java 21 Generational ZGC Ultra-Low Latency)
        if: matrix.component == 'lavalink'
        run: |
          nohup java \
            -XX:+UseZGC \
            -XX:+ZGenerational \
            -Xms1G \
            -Xmx2G \
            -XX:+AlwaysPreTouch \
            -XX:+UseStringDeduplication \
            -XX:+OptimizeStringConcat \
            -XX:+UseNUMA \
            -Djava.net.preferIPv4Stack=true \
            -Djava.net.preferIPv4Addresses=true \
            -Djdk.net.hosts.resolver=SYSTEM \
            -Dnetworkaddress.cache.ttl=120 \
            -Dnetworkaddress.cache.negative.ttl=5 \
            -Dsun.net.inetaddr.ttl=120 \
            -Dsun.net.inetaddr.negative.ttl=5 \
            -Dhttp.keepAlive=true \
            -Dhttp.maxConnections=256 \
            -Dio.netty.allocator.type=pooled \
            -Dio.netty.allocator.numDirectArenas=4 \
            -Dio.netty.noPreferDirect=false \
            -Dio.netty.recycler.maxCapacityPerThread=4096 \
            -jar Lavalink.jar > lavalink.log 2>&1 &
          echo "LAVALINK_PID=$!" >> $GITHUB_ENV
          echo "Lavalink PID: $!"

      - name: Wait for Lavalink Ready
        if: matrix.component == 'lavalink'
        run: |
          echo "Waiting for Lavalink initialization..."
          READY=false
          for i in {1..30}; do
            if grep -q "Lavalink is ready to accept connections" lavalink.log 2>/dev/null || grep -q "Started LauncherKt" lavalink.log 2>/dev/null; then
              echo "Lavalink initialized successfully!"
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" = "true" ]; then
            echo "Lavalink is online and listening!"
          else
            echo "::error::Lavalink startup timed out!"
            tail -n 40 lavalink.log || true
            exit 1
          fi

      - name: Start Cloudflare Tunnel & Expose Lavalink (Low-Jitter HTTP/2 Transport)
        if: matrix.component == 'lavalink'
        id: tunnel
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "Starting persistent Cloudflare Named Tunnel (4 HA Edge Connections)..."
            nohup cloudflared tunnel \
              --protocol http2 \
              --edge-ip-version auto \
              --ha-connections 4 \
              --heartbeat-count 5 \
              --heartbeat-interval 5s \
              run --token "$CF_TOKEN" > tunnel.log 2>&1 &
            echo "TUNNEL_PID=$!" >> $GITHUB_ENV
            HOST="${CF_CUSTOM_DOMAIN:-lavalink.opendrive.indevs.in}"
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=https://$HOST" >> $GITHUB_ENV
          else
            echo "Starting temporary Cloudflare Quick Tunnel (4 HA Edge Connections)..."
            nohup cloudflared tunnel \
              --protocol http2 \
              --edge-ip-version auto \
              --ha-connections 4 \
              --heartbeat-count 5 \
              --heartbeat-interval 5s \
              --url http://127.0.0.1:4998 > tunnel.log 2>&1 &
            echo "TUNNEL_PID=$!" >> $GITHUB_ENV
            TUNNEL_URL=""
            for i in {1..30}; do
              TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then break; fi
              sleep 2
            done
            if [ -z "$TUNNEL_URL" ]; then
              echo "::error::Failed to obtain Quick Tunnel URL!"
              cat tunnel.log || true
              exit 1
            fi
            HOST=$(echo "$TUNNEL_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=https://$HOST" >> $GITHUB_ENV
          fi

      - name: Announce Lavalink Connection Details
        if: matrix.component == 'lavalink'
        run: |
          echo "======================================================"
          echo "🎉 LAVALINK PUBLIC NODE ONLINE: $PUBLIC_URL"
          echo "======================================================"
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 👑 Lavalink Node Active
          | Parameter | Value |
          |---|---|
          | **Host** | `${{ env.PUBLIC_HOST }}` |
          | **Port** | `443` |
          | **Password** | `${{ env.NODE_PASSWORD }}` |
          | **REST Endpoint** | `${{ env.PUBLIC_URL }}` |
          | **WebSocket Endpoint** | `wss://${{ env.PUBLIC_HOST }}:443/v4/websocket` |
          | **GC Engine** | `Java 21 Generational ZGC (<1ms)` |
          | **Voice Transport** | `Netty Native C-Epoll` |
          | **Session #** | `${{ github.run_number }}` |
          EOF

          cat << EOF > NODE_STATUS.md
          # 🟢 Live Public Lavalink Node
          > **Status**: ONLINE 🟢  
          > **Session Run**: #${{ github.run_number }}  
          > **Last Started**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ### 🌐 Public Connection Details
          | Setting | Value |
          |---|---|
          | **Host** | \`$PUBLIC_HOST\` |
          | **Port** | \`443\` |
          | **Password** | \`$NODE_PASSWORD\` |
          | **SSL / Secure** | \`true\` |
          | **REST URI** | \`$PUBLIC_URL\` |
          | **WebSocket URI** | \`wss://$PUBLIC_HOST:443/v4/websocket\` |
          | **GC Engine** | \`Java 21 Generational ZGC (<1ms pauses)\` |
          | **Transport** | \`Netty Native Linux Epoll\` |
          EOF
          sed -i 's/^[ ]\{10\}//' NODE_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NODE_STATUS.md
          git commit -m "docs: update live public node status [skip ci]" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin ${{ github.ref_name }} || true

      - name: Keep Lavalink Alive & Monitor (5.5 Hours)
        if: matrix.component == 'lavalink'
        run: |
          END_TIME=$((SECONDS + 330 * 60))
          tail -f lavalink.log &
          while [ $SECONDS -lt $END_TIME ]; do
            if ! kill -0 $LAVALINK_PID 2>/dev/null; then
              echo "::error::Lavalink process exited unexpectedly!"
              tail -n 50 lavalink.log || true
              exit 1
            fi
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "::error::Tunnel process exited unexpectedly!"
              tail -n 50 tunnel.log || true
              exit 1
            fi
            sleep 30
          done

      # ========================================================================
      # MATRIX COMPONENT B: DISCORD MUSIC BOT FLEET
      # ========================================================================
      - name: Restore Bot Database & Active Sessions Cache
        if: matrix.component == 'music-bot'
        id: restore-bot-data
        uses: actions/cache/restore@v4
        with:
          path: music-bot/data
          key: bot-data-${{ github.run_id }}
          restore-keys: |
            bot-data-

      - name: Restore Backup from Previous Artifact (if Cache Missed)
        if: matrix.component == 'music-bot' && steps.restore-bot-data.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p music-bot/data
          echo "Attempting to retrieve last artifact backup..."
          gh run download --name bot-backup-latest --dir music-bot/data 2>/dev/null || true
          ls -la music-bot/data || true

      - name: Setup Node.js 20.x LTS (Music Bot)
        if: matrix.component == 'music-bot'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'music-bot/package-lock.json'

      - name: Install Dependencies
        if: matrix.component == 'music-bot'
        run: |
          cd music-bot
          npm ci --prefer-offline --no-audit
          cd ..

      - name: Parse Lavalink Connection from NODE_STATUS.md
        if: matrix.component == 'music-bot'
        run: |
          # Wait up to 60s for Lavalink node to initialize if using dynamic tunnel
          if [ -z "${{ secrets.LAVALINK_HOST }}" ]; then
            for i in {1..12}; do
              git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
              if [ -f "NODE_STATUS.md" ]; then break; fi
              sleep 5
            done
          fi
          HOST=""
          PASSWORD=""
          if [ -f "NODE_STATUS.md" ]; then
            HOST=$(grep -o '`https://[^`]*`' NODE_STATUS.md | sed -e 's|`https://||' -e 's|`||' | head -n 1 || true)
            if [ -z "$HOST" ]; then
              HOST=$(grep -oP '(?<=\*\*Host\*\* \| `)[^`]+' NODE_STATUS.md || true)
            fi
            PASSWORD=$(grep -oP '(?<=\*\*Password\*\* \| `)[^`]+' NODE_STATUS.md || true)
          fi
          echo "PARSED_HOST=${HOST:-lavalink.opendrive.indevs.in}" >> $GITHUB_ENV
          echo "PARSED_PORT=443" >> $GITHUB_ENV
          echo "PARSED_SECURE=true" >> $GITHUB_ENV
          echo "PARSED_PASSWORD=${PASSWORD:-youshallnotpass}" >> $GITHUB_ENV

      - name: Register Discord Slash Commands
        if: matrix.component == 'music-bot'
        run: |
          cd music-bot
          node src/deploy-commands.js || true
          cd ..

      - name: Run Music Bot Fleet (5.5 Hours)
        if: matrix.component == 'music-bot'
        env:
          LAVALINK_HOST: ${{ secrets.LAVALINK_HOST || env.PARSED_HOST }}
          LAVALINK_PORT: ${{ secrets.LAVALINK_PORT || env.PARSED_PORT }}
          LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || env.PARSED_PASSWORD }}
          LAVALINK_SECURE: ${{ secrets.LAVALINK_SECURE || env.PARSED_SECURE }}
          AUTO_MAXIMIZE_BITRATE: "true"
          RUNNER_LIFETIME_MS: "19800000"
        run: |
          if [ -z "$DISCORD_TOKEN" ] && [ -z "$DISCORD_TOKENS" ]; then
            echo "::error::Neither DISCORD_TOKEN nor DISCORD_TOKENS secret is configured! Please configure bot token(s) in repository secrets."
            exit 1
          fi
          echo "Starting 24/7 Music Bot Fleet connected to Lavalink: $LAVALINK_HOST:$LAVALINK_PORT..."
          cd music-bot
          node src/sharder.js

      - name: Flush Bot Database & Save Active Sessions
        if: matrix.component == 'music-bot' && always()
        run: |
          if [ -d "music-bot/data" ]; then
            echo "Flushing SQLite WAL checkpoints & verifying database integrity..."
            cd music-bot
            node -e "try { require('./src/database/db').checkpoint(); console.log('DB Checkpoint successful'); } catch(e){ console.log(e.message); }" || true
            cd ..
            ls -lh music-bot/data || true
          fi

      - name: Save Bot Database & Active Sessions Cache
        if: matrix.component == 'music-bot' && always()
        uses: actions/cache/save@v4
        with:
          path: music-bot/data
          key: bot-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Persistent Bot Data Artifact
        if: matrix.component == 'music-bot' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-backup-latest
          path: music-bot/data
          retention-days: 30
          overwrite: true

      - name: Commit and Push Persistent State to Repository
        if: matrix.component == 'music-bot' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "music-bot/data/bot.db" ]; then
            git add music-bot/data/bot.db
          fi
          if [ -f "music-bot/data/active_sessions.json" ]; then
            git add music-bot/data/active_sessions.json
          fi
          git commit -m "chore(data): auto-sync bot database & active sessions [skip ci]" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin ${{ github.ref_name }} || true

  # ============================================================================
  # 24/7 SELF-HEALING RECOVERY LOOP (Runs Once for Both Services)
  # ============================================================================
  recover:
    name: 24/7 Self-Healing Dispatcher
    needs: matrix-runner
    if: always() && needs.matrix-runner.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Prevent Duplicate Sessions & Re-dispatch Next Session
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GH_REPOSITORY}/actions/workflows/main.yml/runs?per_page=30" || echo '{"workflow_runs":[]}')"
          active="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[] | select((.id | tostring) != $current) | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "Another matrix session is already running. Skipping duplicate dispatch."
          else
            echo "Dispatching next 24/7 production matrix session on branch: $BRANCH..."
            gh api --method POST \
              "repos/${GH_REPOSITORY}/actions/workflows/main.yml/dispatches" \
              -f ref="$BRANCH"
            echo "Next matrix session dispatched successfully!"
          fi

name: 24/7 Discord Music Bot Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'music-bot/**'
      - '.github/workflows/music-bot.yml'
    branches:
      - main
      - master

concurrency:
  group: 247-music-bot
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  bot:
    name: Discord Music Bot Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Bot Database & Active Sessions Cache
        id: restore-bot-data
        uses: actions/cache/restore@v4
        with:
          path: music-bot/data
          key: bot-data-${{ github.run_id }}
          restore-keys: |
            bot-data-

      - name: Restore Backup from Previous Artifact (if Cache Missed)
        if: steps.restore-bot-data.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
        run: |
          mkdir -p music-bot/data
          echo "Attempting to retrieve last artifact backup..."
          gh run download --name bot-backup-latest --dir music-bot/data 2>/dev/null || true
          ls -la music-bot/data || true

      - name: Setup Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'music-bot/package-lock.json'

      - name: Install Dependencies
        run: |
          cd music-bot
          npm ci --prefer-offline --no-audit
          cd ..

      - name: Parse Lavalink Connection from NODE_STATUS.md
        id: lavalink_info
        run: |
          HOST=""
          PORT=""
          PASSWORD=""
          SECURE="true"

          if [ -f "NODE_STATUS.md" ]; then
            HOST=$(grep -o '`https://[^`]*`' NODE_STATUS.md | sed -e 's|`https://||' -e 's|`||' | head -n 1 || true)
            if [ -z "$HOST" ]; then
              HOST=$(grep -oP '(?<=\*\*Host\*\* \| `)[^`]+' NODE_STATUS.md || true)
            fi
            PASSWORD=$(grep -oP '(?<=\*\*Password\*\* \| `)[^`]+' NODE_STATUS.md || true)
          fi

          echo "PARSED_HOST=${HOST:-lavalink.opendrive.indevs.in}" >> $GITHUB_ENV
          echo "PARSED_PORT=443" >> $GITHUB_ENV
          echo "PARSED_SECURE=true" >> $GITHUB_ENV
          echo "PARSED_PASSWORD=${PASSWORD:-youshallnotpass}" >> $GITHUB_ENV

      - name: Register Discord Slash Commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID || '' }}
        run: |
          if [ -n "$DISCORD_TOKEN" ] && [ -n "$CLIENT_ID" ]; then
            echo "Deploying Discord application slash commands..."
            cd music-bot
            node src/deploy-commands.js || true
            cd ..
          fi

      - name: Start Music Bot Sharder
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID || '' }}
          LAVALINK_HOST: ${{ secrets.LAVALINK_HOST || env.PARSED_HOST }}
          LAVALINK_PORT: ${{ secrets.LAVALINK_PORT || env.PARSED_PORT }}
          LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || env.PARSED_PASSWORD }}
          LAVALINK_SECURE: ${{ secrets.LAVALINK_SECURE || env.PARSED_SECURE }}
          AUTO_MAXIMIZE_BITRATE: "true"
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::DISCORD_TOKEN secret is missing! Please configure it in your repository secrets."
            exit 1
          fi

          echo "Starting Music Bot connected to Lavalink: $LAVALINK_HOST:$LAVALINK_PORT..."
          cd music-bot
          nohup node src/sharder.js > bot.log 2>&1 &
          echo "BOT_PID=$!" >> $GITHUB_ENV
          echo "Bot PID: $!"
          cd ..

      - name: Keep Bot Alive & Stream Logs (5.5 Hours)
        run: |
          END_TIME=$((SECONDS + 330 * 60))
          tail -f music-bot/bot.log &

          while [ $SECONDS -lt $END_TIME ]; do
            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "::error::Music Bot process crashed!"
              tail -n 50 music-bot/bot.log || true
              exit 1
            fi
            sleep 30
          done

      # ------------------------------------------------------------------------
      # Triple-Tier Backup Phase (Artifacts + Cache + Git)
      # ------------------------------------------------------------------------
      - name: Flush Bot Database & Save Active Sessions
        if: always()
        run: |
          if [ -d "music-bot/data" ]; then
            echo "Flushing SQLite WAL checkpoints & capturing active sessions..."
            if [ -n "$BOT_PID" ]; then
              kill -SIGTERM $BOT_PID 2>/dev/null || true
              sleep 3
            fi
            cd music-bot
            node -e "try { require('./src/database/db').checkpoint(); console.log('DB Checkpoint successful'); } catch(e){ console.log(e.message); }" || true
            cd ..
            ls -lh music-bot/data || true
          fi

      - name: Save Bot Database & Active Sessions Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: music-bot/data
          key: bot-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Persistent Bot Data Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-backup-latest
          path: music-bot/data
          retention-days: 30
          overwrite: true

      - name: Commit and Push Persistent State to Repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "music-bot/data/bot.db" ]; then
            git add music-bot/data/bot.db
          fi
          if [ -f "music-bot/data/active_sessions.json" ]; then
            git add music-bot/data/active_sessions.json
          fi
          git commit -m "chore(data): auto-sync bot database & active sessions [skip ci]" || true
          git push origin main || true

  # ============================================================================
  # RECOVERY JOB (Self-Healing 24/7 Loop for Bot)
  # ============================================================================
  recover:
    needs: bot
    if: always() && needs.bot.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Prevent Duplicate Sessions
        id: check_active
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GH_REPOSITORY}/actions/workflows/music-bot.yml/runs?per_page=30" || echo '{"workflow_runs":[]}')"
          active="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[] | select((.id | tostring) != $current) | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Another bot session is already running. Skipping duplicate dispatch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Next Session
        if: steps.check_active.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Dispatching next 24/7 bot session on branch: $BRANCH..."
          gh api --method POST \
            "repos/${GH_REPOSITORY}/actions/workflows/music-bot.yml/dispatches" \
            -f ref="$BRANCH"
          echo "Next bot session dispatched successfully!"

# ==============================================================================
# Lavalink v4 Configuration Template (Standalone / Zero Remote Dependencies)
# ==============================================================================
# - Multi-source support: YouTube, Spotify, Deezer, JioSaavn, SoundCloud, etc.
# - Spotify uses internal GraphQL (NO Spotify Developer App or Premium required!)
# ==============================================================================

server:
    address: 0.0.0.0
    port: 4998 # Set your desired server port
    http2:
        enabled: false
    undertow:
        buffer-size: 8192
        direct-buffers: true
        io-threads: 4
        no-request-timeout: 60000
        worker-threads: 32

lavalink:
    plugins: [] # Loads pre-bundled local JARs from ./plugins
    pluginsDir: "./plugins"
    server:
        password: "YOUR_LAVALINK_PASSWORD" # Change this password
        bufferDurationMs: 400
        frameBufferDurationMs: 5000
        playerUpdateInterval: 5
        opusEncodingQuality: 10
        resamplingQuality: HIGH
        trackStuckThresholdMs: 10000
        useSeekGhosting: true
        gcWarnings: false
        youtubeSearchEnabled: false # Handled via dev.lavalink.youtube
        soundcloudSearchEnabled: true
        sources:
            youtube: false # Handled by dev.lavalink.youtube plugin
            soundcloud: true
            bandcamp: true
            twitch: true
            vimeo: true
            nico: true
            http: true
            local: false
        filters:
            volume: true
            equalizer: true
            karaoke: true
            timescale: true
            tremolo: true
            vibrato: true
            distortion: true
            rotation: true
            channelMix: true
            lowPass: true

plugins:
    # --------------------------------------------------------------------------
    # YouTube Plugin (dev.lavalink.youtube)
    # --------------------------------------------------------------------------
    youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        clients:
            - ANDROID
            - ANDROID_VR
            - ANDROID_MUSIC
            - TVHTML5_SIMPLY
            - TV
            - MUSIC
            - WEBEMBEDDED
            - WEB
            - IOS
            - MWEB
        clientOptions:
            ANDROID:
                playback: true
                searching: true
            TV:
                playback: true
                searching: true
            ANDROID_VR:
                playback: true
                searching: true
            ANDROID_MUSIC:
                playback: true
                searching: true
            TVHTML5_SIMPLY:
                playback: true
                searching: true
            MUSIC:
                playback: true
                searching: true
            WEBEMBEDDED:
                playback: true
                searching: true
            WEB:
                playback: true
                searching: true
            IOS:
                playback: true
                searching: true
            MWEB:
                playback: true
                searching: true
        oauth:
            enabled: false
            skipInitialization: true
            refreshToken: ""
        remoteCipher:
            url: "https://cipher.kikkia.dev"
            userAgent: "yt-source"

    # --------------------------------------------------------------------------
    # LavaSrc Plugin (Spotify / Deezer)
    # --------------------------------------------------------------------------
    lavasrc:
        sources:
            spotify: false # Handled by SolaceAudio
            applemusic: false
            deezer: false
            yandexmusic: false
            flowerytts: false
            youtube: false
        providers:
            - "dzisrc:\"%ISRC%\""
            - "dzsearch:%QUERY%"
            - "jssearch:%QUERY%"
            - "ytmsearch:\"%ISRC%\""
            - "ytmsearch:%QUERY%"
        spotify:
            clientId: "YOUR_SPOTIFY_CLIENT_ID"
            clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET"
            spDc: "YOUR_SPOTIFY_SP_DC_COOKIE"
            countryCode: "IN"
            playlistLoadLimit: 50
            albumLoadLimit: 50
            resolveArtistsInSearch: true
            localFiles: false

    # --------------------------------------------------------------------------
    # SolaceAudio Plugin (Spotify, Deezer & Indian Streaming - NO PREMIUM NEEDED)
    # --------------------------------------------------------------------------
    solaceaudio:
        sources:
            spotify: true # Enabled! Bypasses Spotify Developer / Premium restrictions
            jiosaavn: true
            gaana: false
            amazonmusic: false
            deezer: true # Enabled! Direct original audio stream without IP restrictions
            pandora: false
            youtube: false
            flowerytts: false
        providers:
            - "dzisrc:{isrc}"
            - "dzsearch:{query}"
            - "jssearch:{query}"
            - "ytmsearch:\"{isrc}\""
            - "ytmsearch:{query}"
        spotify:
            countryCode: "IN"
            playlistLoadLimit: 50
            albumLoadLimit: 50
            resolveArtistsInSearch: true
            localFiles: false
            spDc: "YOUR_SPOTIFY_SP_DC_COOKIE"
        deezer:
            apiUrl: "https://deezer-plugin-api.vercel.app/api"
            playlistLoadLimit: 50
            albumLoadLimit: 50
            artistLoadLimit: 50
            searchLimit: 50

    # --------------------------------------------------------------------------
    # LavaSearch Plugin (com.github.topi314.lavasearch)
    # --------------------------------------------------------------------------
    lavasearch:
        sources:
            youtube: true
            spotify: true
            deezer: false
            soundcloud: false

logging:
    file:
        path: ./logs/
    level:
        com.solaceaudio: INFO
        lavalink: INFO
        moe.kyokobot.koe: INFO
        root: INFO
    logback:
        rollingPolicy:
            maxFileSize: 1GB
            maxHistory: 30
    request:
        enabled: true
        includeClientInfo: true
        includeHeaders: false
        includePayload: true
        includeQueryString: true
        maxPayloadLength: 10000

metrics:
    prometheus:
        enabled: false
        endpoint: /metrics

sentry:
    dsn: ""
    environment: ""
